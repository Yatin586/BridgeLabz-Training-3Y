<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animation Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CSS Keyframe Animations</h1>
  </header>

  <main>
    <section class="animation-stage">

      <div class="animation-block">
        <div class="moving-box"></div>
        <p>Moving box &mdash; translateX loop</p>
      </div>

      <div class="animation-block">
        <div class="bouncing-ball"></div>
        <p>Bouncing ball &mdash; vertical bounce</p>
      </div>

      <div class="animation-block">
        <p class="color-text">Color-Changing Text</p>
        <p>Cycles through colors continuously</p>
      </div>

    </section>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 6: CSS Animation Demonstration</p>
  </footer>
</body>
</html>
