<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Gallery Showcase</h1>
    <p>Hover over an image to see it scale and darken.</p>
  </header>

  <main>
    <section class="gallery">

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/mountain/400/300" alt="Mountain lake at dawn" class="gallery-image">
        <figcaption>Mountain Lake</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/desert/400/300" alt="Desert dunes at sunset" class="gallery-image">
        <figcaption>Desert Sunset</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/ocean/400/300" alt="Ocean waves rolling in" class="gallery-image">
        <figcaption>Ocean Waves</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/city/400/300" alt="City skyline at night" class="gallery-image">
        <figcaption>City Lights</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/nightsky/400/300" alt="Stars over a dark sky" class="gallery-image">
        <figcaption>Night Sky</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/forest/400/300" alt="Foggy forest path" class="gallery-image">
        <figcaption>Foggy Forest</figcaption>
      </figure>

    </section>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 3: Image Showcase</p>
  </footer>
</body>
</html>
