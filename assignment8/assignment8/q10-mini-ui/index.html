<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini User Interface Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Create Your Account</h1>
  </header>

  <main class="page-main">
    <section class="content-card">

      <img
        src="https://picsum.photos/seed/avatar/120/120"
        alt="Default profile avatar"
        class="card-image"
      >

      <form class="signup-form" action="#">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe">

        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com">

        <div class="form-buttons">
          <button type="submit" class="btn btn-primary">Create account</button>
          <button type="reset" class="btn btn-outline">Clear</button>
        </div>
      </form>

    </section>
  </main>

  <footer class="site-footer">
    <p>Assignment 8 &mdash; Question 10: Mini User Interface Layout</p>
  </footer>
</body>
</html>
