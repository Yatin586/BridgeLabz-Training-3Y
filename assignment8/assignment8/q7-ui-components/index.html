<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Interface Components</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>UI Components</h1>
  </header>

  <main>
    <section class="ui-card">

      <div class="ui-row">
        <input type="search" class="search-bar" placeholder="Search anything...">
        <button class="ui-button" type="button">Search</button>
      </div>

      <div class="ui-row">
        <select class="ui-dropdown">
          <option>Select a category</option>
          <option>Electronics</option>
          <option>Clothing</option>
          <option>Books</option>
        </select>
        <button class="ui-button secondary" type="button">Filter</button>
      </div>

    </section>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 7: UI Components</p>
  </footer>
</body>
</html>
