<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Button Collection</h1>
    <p>Hover, click, tab to, and inspect the disabled state below.</p>
  </header>

  <main>
    <section class="button-row">
      <button class="btn btn-primary" type="button">Primary</button>
      <button class="btn btn-secondary" type="button">Secondary</button>
      <button class="btn btn-outline" type="button">Outline</button>
      <button class="btn btn-primary" type="button" disabled>Disabled</button>
    </section>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 5: Styled Button Collection</p>
  </footer>
</body>
</html>
