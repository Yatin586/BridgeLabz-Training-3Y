<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CSS-Only Tooltips</h1>
    <p>Hover over each item to reveal its tooltip.</p>
  </header>

  <main>
    <section class="tooltip-row">

      <span class="tooltip-item" tabindex="0">
        Settings
        <span class="tooltip-bubble">Adjust your preferences</span>
      </span>

      <span class="tooltip-item" tabindex="0">
        Profile
        <span class="tooltip-bubble">View and edit your profile</span>
      </span>

      <span class="tooltip-item" tabindex="0">
        Notifications
        <span class="tooltip-bubble">Check recent alerts</span>
      </span>

      <span class="tooltip-item" tabindex="0">
        Help
        <span class="tooltip-bubble">Browse the support center</span>
      </span>

    </section>
  </main>

  <footer>
    <p>Assignment 8 &mdash; Question 2: Tooltips</p>
  </footer>
</body>
</html>
