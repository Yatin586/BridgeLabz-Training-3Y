<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Assignment 4 Runner</title></head>
<body>
<script>
  const q = new URLSearchParams(location.search).get("q");
  if (!q) {
    document.body.innerHTML = "<h3>Pick a question</h3>" +
      ["q2","q4","q5","q7","q8"].map(n => `<p><a href="run.html?q=${n}">${n}</a></p>`).join("");
  } else {
    const s = document.createElement("script");
    s.src = q + ".js";
    document.body.appendChild(s);
  }
</script>
</body>
</html>
