<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bg-primary text-white p-4"><div class="container d-flex justify-content-between align-items-center"><h1 class="mb-0">Task Tracker</h1><span class="badge bg-danger fs-6">4 Pending</span></div></header>
<main class="container py-5"><h2 class="mb-4">My Tasks</h2>
<div class="list-group">
<div class="list-group-item d-flex justify-content-between align-items-center">Complete cybersecurity assignment<span class="badge bg-danger">High</span></div>
<div class="list-group-item d-flex justify-content-between align-items-center">Prepare Java notes<span class="badge bg-warning text-dark">Medium</span></div>
<div class="list-group-item d-flex justify-content-between align-items-center">Practice DSA problems<span class="badge bg-success">Low</span></div>
<div class="list-group-item d-flex justify-content-between align-items-center">Submit project report<span class="badge bg-danger">High</span></div>
</div>
<div class="mt-4"><button class="btn btn-success">Completed <span class="badge bg-light text-dark">6</span></button></div>
</main>
<footer class="bg-dark text-white text-center p-3">&copy; 2026 Task Tracker</footer>
</body>
</html>
