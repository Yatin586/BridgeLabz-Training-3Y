<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<div class="box">
<a href="#">Hover Link</a>
<p>:hover changes color when mouse is over.</p>
</div>

<div class="box">
<input type="text" placeholder="Focus Here">
<p>:focus activates when clicked.</p>
</div>

<div class="box">
<button>Click Me</button>
<p>:active works while button is pressed.</p>
</div>

<div class="box">
<ul>
<li>Item 1</li>
<li>Item 2</li>
<li>Item 3</li>
<li>Item 4</li>
</ul>
<p>:nth-child(even) styles alternate items.</p>
</div>

</div>

</body>
</html>
