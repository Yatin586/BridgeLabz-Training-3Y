<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q6 - Table Filter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Real-Time Table Filter</h1>

  <input type="text" id="searchInput" placeholder="Search by name, branch or CGPA">

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Branch</th>
        <th>CGPA</th>
      </tr>
    </thead>
    <tbody id="studentTable">
      <tr><td>Aarav Sharma</td><td>CSE</td><td>8.9</td></tr>
      <tr><td>Diya Verma</td><td>ECE</td><td>8.2</td></tr>
      <tr><td>Rohan Gupta</td><td>Mechanical</td><td>7.4</td></tr>
      <tr><td>Sneha Singh</td><td>CSE</td><td>9.1</td></tr>
      <tr><td>Kabir Mehta</td><td>Civil</td><td>6.8</td></tr>
      <tr><td>Priya Nair</td><td>IT</td><td>8.5</td></tr>
    </tbody>
  </table>

  <p id="noResults" class="error hidden">No results found</p>

  <script src="q6_table_filter.js"></script>
</body>
</html>
