<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q4 - Theme Switcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Theme Switcher</h1>
  <p>Current theme: <strong id="themeLabel">light</strong></p>

  <!-- data-theme-choice holds which theme each button applies -->
  <button data-theme-choice="light">Light</button>
  <button data-theme-choice="dark">Dark</button>
  <button data-theme-choice="blue">Blue</button>

  <script src="q4_theme_switcher.js"></script>
</body>
</html>
