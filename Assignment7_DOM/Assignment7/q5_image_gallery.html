<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q5 - Image Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Image Gallery with Modal Preview</h1>

  <!-- Images are generated by the script, so no internet connection is needed -->
  <div class="gallery" id="gallery"></div>

  <!-- Overlay covers the screen; clicking it closes the modal -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-content" id="modalContent">
      <img id="modalImage" alt="Large preview">
    </div>
  </div>

  <script src="q5_image_gallery.js"></script>
</body>
</html>
