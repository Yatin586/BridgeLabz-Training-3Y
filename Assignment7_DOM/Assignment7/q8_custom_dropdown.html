<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 - Custom Dropdown</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Custom Dropdown (no select tag)</h1>

  <div class="dropdown" id="dropdown">
    <button id="dropdownBtn">Choose a fruit</button>
    <ul id="dropdownList" class="hidden">
      <li>Apple</li>
      <li>Banana</li>
      <li>Mango</li>
      <li>Orange</li>
    </ul>
  </div>

  <script src="q8_custom_dropdown.js"></script>
</body>
</html>
