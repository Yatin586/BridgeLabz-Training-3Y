<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Sets the character encoding so all text (including special characters) displays correctly -->
    <meta charset="UTF-8">

    <!-- Describes the page content, often used by search engines -->
    <meta name="description" content="A demo page showing all important head elements in HTML">

    <!-- Specifies the author of the page -->
    <meta name="author" content="Yatin">

    <!-- Sets a base URL for all relative links on the page -->
    <base href="https://example.com/">

    <!-- Links a favicon (small icon shown in the browser tab) -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Internal CSS would go here (kept empty as per instructions) -->
    <style>
    </style>

    <!-- The title shown in the browser tab -->
    <title>Q20 - Head Elements Demo</title>

    <!-- Internal JavaScript would go here (kept empty as per instructions) -->
    <script>
    </script>
</head>
<body>
    <h1>Head Elements Demo Page</h1>
    <p>This page demonstrates the important elements found inside the &lt;head&gt; section of an HTML document.</p>
</body>
</html>
