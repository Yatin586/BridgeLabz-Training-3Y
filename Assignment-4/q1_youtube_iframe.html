<!DOCTYPE html>
<html lang="en">
<head>
    <title>Q1 - YouTube Video Embed</title>
</head>
<body>
    <!-- This iframe embeds a YouTube video -->
    <!-- width and height are given in percentage so the video resizes with the browser window -->
    <h1>My Favorite YouTube Video</h1>
    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="80%"
        height="60%"
        title="YouTube video player"
        allowfullscreen>
    </iframe>
</body>
</html>
