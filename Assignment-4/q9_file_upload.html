<!DOCTYPE html>
<html lang="en">
<head>
    <title>Q9 - File Upload Form</title>
</head>
<body>
    <h1>Upload Your Profile Picture</h1>
    <form method="post" action="#" enctype="multipart/form-data">
        <label for="profile_pic">Choose an image:</label><br>
        <input type="file" id="profile_pic" name="profile_pic" accept=".jpg,.png"><br><br>
        <input type="submit" value="Upload">
    </form>
    <p>Only .jpg and .png image files are allowed for upload.</p>
</body>
</html>
