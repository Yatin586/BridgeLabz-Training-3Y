<!DOCTYPE html>
<html lang="en">
<head>
    <title>Q7 - Login Form</title>
</head>
<body>
    <h1>Login</h1>
    <form method="post" action="#">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- 
            A CSRF (Cross-Site Request Forgery) token is a hidden, random value 
            generated by the server for each session/form. It is submitted along 
            with the form and verified by the server to make sure the request 
            actually came from a legitimate page on the site, and not from a 
            malicious site tricking the user's browser into submitting the form.
        -->
        <input type="hidden" name="csrf_token" value="a1b2c3d4e5f6dummy">

        <input type="submit" value="Login">
    </form>
</body>
</html>
