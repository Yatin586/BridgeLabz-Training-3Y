<!DOCTYPE html>
<html lang="en">
<head>
    <title>Q2 - Google Map Embed</title>
</head>
<body>
    <h1>My City on the Map</h1>
    <!-- 
        The loading="lazy" attribute tells the browser to delay loading 
        the iframe content until the user scrolls near it. 
        This improves page load speed and saves bandwidth.
    -->
    <iframe
        title="Map of Mathura, Uttar Pradesh"
        src="https://www.google.com/maps?q=Mathura,Uttar+Pradesh&output=embed"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
