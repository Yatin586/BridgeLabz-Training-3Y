<!DOCTYPE html>
<html lang="en">
<head>
    <title>Q18 - Quotations</title>
</head>
<body>
    <h1>Quotations Example</h1>

    <!-- Long quotation using blockquote -->
    <blockquote>
        Cybersecurity is much more than a matter of IT, and awareness &amp; training are key to staying safe online.
    </blockquote>

    <!-- Short quotation using q tag inside a paragraph -->
    <p>As my professor once said, <q>practice is the best teacher</q>, and I try to remember that every day.</p>
</body>
</html>
