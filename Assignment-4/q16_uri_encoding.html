<!DOCTYPE html>
<html lang="en">
<head>
    <title>Q16 - URI Encoding Demo</title>
</head>
<body>
    <h1>URI Encoding Example</h1>
    <p>Original URL (with spaces and special characters):</p>
    <p>https://example.com/search?query=HTML & CSS</p>

    <p>Correctly encoded URL (spaces replaced with %20, & encoded as %26):</p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        https://example.com/search?query=HTML%20%26%20CSS
    </a>
</body>
</html>
