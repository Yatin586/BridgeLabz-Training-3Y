<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Registration Form</title>
</head>
<body>

    <h1>Course Registration Form</h1>

    <form action="#" method="post">

        <!-- Personal details grouped with fieldset -->
        <fieldset>
            <legend>Personal Details</legend>

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>
        </fieldset>

        <br>

        <!-- Course selection grouped with fieldset -->
        <fieldset>
            <legend>Course Selection</legend>

            <label for="course">Select Course:</label>
            <select id="course" name="course">
                <option value="html">HTML & CSS Basics</option>
                <option value="js">JavaScript Fundamentals</option>
                <option value="python">Python Programming</option>
                <option value="security">Cybersecurity Essentials</option>
            </select>
        </fieldset>

        <br>

        <input type="submit" value="Register">

    </form>

    <br>

    <!-- Course schedule table -->
    <h2>Available Course Schedules</h2>
    <table border="1" cellpadding="8">
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>10:00 AM - 12:00 PM</td>
            <td>Mr. Sharma</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>2:00 PM - 4:00 PM</td>
            <td>Ms. Verma</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>11:00 AM - 1:00 PM</td>
            <td>Mr. Gupta</td>
        </tr>
    </table>

</body>
</html>
