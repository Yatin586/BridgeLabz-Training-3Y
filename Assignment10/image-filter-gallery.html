<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 - Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="image-filter-gallery.css">
</head>
<body>

    <header class="site-header">
        <h1>Responsive Image Filter Gallery</h1>
        <p>Hover over an image to remove its filter</p>
    </header>

    <main>
        <section class="gallery">

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/10/500/400" alt="Forest landscape" class="filter-blur">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/20/500/400" alt="Laptop on desk" class="filter-grayscale">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/30/500/400" alt="Bicycle wheel close up" class="filter-sepia">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/40/500/400" alt="Plant leaves" class="filter-brightness">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/50/500/400" alt="Mountain road" class="filter-contrast">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/id/60/500/400" alt="City street" class="filter-hue">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Assignment 9 - Question 1</p>
    </footer>

</body>
</html>
