<!DOCTYPE html>
<html lang="en">
<head>

    <title>Q5 - Filter Cards with Animation</title>
    <link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>

    <header class="page-header">

    <main>

                <p>Product Designer</p>
            </article>

            <article class="profile-card">
                <img src="https://picsum.photos/id/91/300/300" alt="Profile photo of team member two">
                <h2>Rohan Mehta</h2>
                <p>Frontend Developer</p>
            </article>

            <article class="profile-card">
                <img src="https://picsum.photos/id/177/300/300" alt="Profile photo of team member three">
                <h2>Sara Ali</h2>
                <p>UX Researcher</p>
            </article>

        </section>
    </main>

</body>
</html>
