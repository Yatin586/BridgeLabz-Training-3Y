<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 - Filter Comparison Layout</title>
    <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>

    <header class="page-header">
        <h1>Before &amp; After Filter Comparison</h1>
    </header>

    <main>
        <section class="comparison-row">

            <figure class="compare-item">
                <img src="https://picsum.photos/id/200/450/350" alt="Original unfiltered photo">
                <figcaption>Original</figcaption>
            </figure>

            <figure class="compare-item">
                <img src="https://picsum.photos/id/200/450/350" alt="Photo with contrast filter applied" class="filtered">
                <figcaption>Filtered (hover to compare)</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
