<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

    <!-- School name -->
    <h1>Sunrise Public School</h1>
    <h2>Student Report Card</h2>

    <table border="1" cellpadding="8" title="Marks report for 5 subjects">
        <tr>
            <th>Subject</th>
            <th>Marks Obtained</th>
            <th>Max Marks</th>
        </tr>
        <tr>
            <td>Mathematics</td>
            <td>92</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>88</td>
            <td>100</td>
        </tr>
        <tr>
            <td>English</td>
            <td>85</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Social Science</td>
            <td>90</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Computer Science</td>
            <td>95</td>
            <td>100</td>
        </tr>

        <!-- Total and Percentage row using colspan for clarity -->
        <tr>
            <td colspan="2" title="Sum of all marks obtained">Total</td>
            <td>450 / 500</td>
        </tr>
        <tr>
            <td colspan="2" title="Percentage calculated from total marks">Percentage</td>
            <td>90%</td>
        </tr>
    </table>

</body>
</html>
