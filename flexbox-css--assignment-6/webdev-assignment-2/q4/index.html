<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grid Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
  <header class="dash-header">
    <h1>Security Dashboard</h1>
  </header>

  <aside class="dash-sidebar">
    <nav>
      <ul>
        <li><a href="#">Overview</a></li>
        <li><a href="#">Alerts</a></li>
        <li><a href="#">Reports</a></li>
        <li><a href="#">Settings</a></li>
      </ul>
    </nav>
  </aside>

  <main class="dash-main">
    <div class="dash-box wide">
      <h2>Active Threats Summary</h2>
      <p>3 alerts require review in the last 24 hours across two endpoints.</p>
    </div>
    <div class="dash-box">
      <h2>System Uptime</h2>
      <p>99.98% over the past 30 days.</p>
    </div>
    <div class="dash-box">
      <h2>Open Tickets</h2>
      <p>5 tickets currently assigned to the response team.</p>
    </div>
  </main>
</div>
</body>
</html>
