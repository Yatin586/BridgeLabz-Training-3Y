<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pricing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="page-title">Pricing Plans</h1>

<div class="pricing-container">
  <div class="plan">
    <h2>Basic</h2>
    <p class="price">$9<span>/mo</span></p>
    <p>1 Project, 5GB Storage</p>
  </div>

  <div class="plan featured">
    <h2>Standard</h2>
    <p class="price">$19<span>/mo</span></p>
    <p>10 Projects, 50GB Storage</p>
  </div>

  <div class="plan">
    <h2>Premium</h2>
    <p class="price">$39<span>/mo</span></p>
    <p>Unlimited Projects, 500GB Storage</p>
  </div>
</div>
</body>
</html>
